# Production on one Linux server (4 GB RAM is plenty to start).
# Everything that talks to routers shares wg-gateway's network namespace:
# api, worker and radius reach routers at 10.200.x.x through wg0, and routers
# send RADIUS to 10.200.0.1. Only 80/443 (Caddy) and 51820/udp are public.
#
#   cp .env.example .env && edit it (see docs/DEPLOYMENT.md)
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set in .env}
      POSTGRES_DB: wisp
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "owner", "-d", "wisp"]
      interval: 5s
      retries: 30

  wg-gateway:
    build: { context: ., dockerfile: infra/docker/wg-gateway.Dockerfile }
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://wisp_api:${APP_DB_PASSWORD}@postgres:5432/wisp?sslmode=disable
    ports:
      - "51820:51820/udp"
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: infra/docker/go.Dockerfile, args: { CMD: api } }
    restart: unless-stopped
    network_mode: service:wg-gateway
    env_file: .env
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      TRUST_PROXY_HEADERS: "true"
      DATABASE_URL: postgres://wisp_api:${APP_DB_PASSWORD}@postgres:5432/wisp?sslmode=disable
      MIGRATE_DATABASE_URL: postgres://owner:${POSTGRES_OWNER_PASSWORD}@postgres:5432/wisp?sslmode=disable
    depends_on: [wg-gateway]

  worker:
    build: { context: ., dockerfile: infra/docker/go.Dockerfile, args: { CMD: api } }
    restart: unless-stopped
    command: ["--role=worker"]
    network_mode: service:wg-gateway
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://wisp_api:${APP_DB_PASSWORD}@postgres:5432/wisp?sslmode=disable
    depends_on: [api]

  radius:
    build: { context: ., dockerfile: infra/docker/go.Dockerfile, args: { CMD: radius } }
    restart: unless-stopped
    network_mode: service:wg-gateway
    env_file: .env
    environment:
      APP_ENV: production
      RADIUS_HTTP_ADDR: 127.0.0.1:8081
      DATABASE_URL: postgres://wisp_api:${APP_DB_PASSWORD}@postgres:5432/wisp?sslmode=disable
    depends_on: [wg-gateway]

  freeradius:
    build: { context: ., dockerfile: infra/docker/freeradius.Dockerfile }
    restart: unless-stopped
    network_mode: service:wg-gateway
    env_file: .env
    environment:
      RADIUS_BACKEND_URL: http://127.0.0.1:8081
    depends_on: [radius]

  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    restart: unless-stopped
    environment:
      API_URL: http://wg-gateway:8080
      DASHBOARD_HOSTS: ${APP_DOMAIN}
    depends_on: [api]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: service:wg-gateway
    env_file: .env
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
