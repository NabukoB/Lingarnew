name: wisp-saas

on:
  push:
    paths: ["wisp-saas/**", ".github/workflows/wisp-saas.yml"]
  pull_request:
    paths: ["wisp-saas/**", ".github/workflows/wisp-saas.yml"]

defaults:
  run:
    working-directory: wisp-saas

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wisp-saas/go.mod
          cache-dependency-path: wisp-saas/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: sqlc generated code is committed
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.27.0
          sqlc generate
          git diff --exit-code -- internal/store
      - name: unit + integration tests (testcontainers)
        run: go test -count=1 ./...
      - name: RADIUS end to end (FreeRADIUS + radclient)
        run: |
          docker build -f infra/docker/freeradius.Dockerfile -t wisp-freeradius .
          go test -count=1 -tags e2e ./tests/e2e/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wisp-saas/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wisp-saas/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next lint
      - run: npx vitest run
      - run: npm run build
      - name: JavaScript bundle budgets
        run: |
          PERF_REPORT=/tmp/perf node scripts/bundle-budget.mjs
          cat /tmp/perf/bundles.md >> "$GITHUB_STEP_SUMMARY"

  e2e:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wisp-saas/go.mod
          cache-dependency-path: wisp-saas/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wisp-saas/web/package-lock.json
      - name: Postgres
        run: |
          docker run -d --name pg -e POSTGRES_USER=owner -e POSTGRES_PASSWORD=owner -e POSTGRES_DB=wisp \
            -e APP_DB_PASSWORD=wisp_api -e ADMIN_DB_PASSWORD=wisp_admin \
            -v "$PWD/infra/postgres/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro" \
            -p 55432:5432 postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U owner -d wisp && break; sleep 1; done
          sleep 3
      - name: API
        run: |
          go build -o /tmp/api ./cmd/api
          export DATABASE_URL=postgres://wisp_api:wisp_api@localhost:55432/wisp?sslmode=disable
          export ADMIN_DATABASE_URL=postgres://wisp_admin:wisp_admin@localhost:55432/wisp?sslmode=disable
          export MIGRATE_DATABASE_URL=postgres://owner:owner@localhost:55432/wisp?sslmode=disable
          export LOCAL_KEK=$(openssl rand -base64 32) RADIUS_SECRET_SEED=ci
          export TRUST_PROXY_HEADERS=true  # as behind the production proxy; tests set one client IP per browser
          export WG_SERVER_PUBLIC_KEY=c2VydmVyLXB1YmxpYy1rZXktMzItYnl0ZXMtbG9uZyE=
          nohup /tmp/api > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          # A staff account for the admin console test; its authenticator secret stays masked.
          pw="ci-admin-$(openssl rand -hex 8)"
          secret=$(ADMIN_PASSWORD="$pw" /tmp/api -role add-admin -email ci-admin@example.com -name CI | sed -n 's/^  secret: //p')
          echo "::add-mask::$secret"
          echo "::add-mask::$pw"
          { echo "E2E_ADMIN_EMAIL=ci-admin@example.com"; echo "E2E_ADMIN_PASSWORD=$pw"; echo "E2E_ADMIN_SECRET=$secret"; } >> "$GITHUB_ENV"
      - name: Web
        working-directory: wisp-saas/web
        run: |
          npm ci
          npm run build
          API_URL=http://localhost:8080 nohup npm start > /tmp/web.log 2>&1 &
          npx playwright install --with-deps chromium
          for i in $(seq 1 30); do curl -s -o /dev/null localhost:3010/login && break; sleep 1; done
          # Web Vitals budgets get 1.5× headroom on shared runners.
          PERF_REPORT=/tmp/perf PERF_BUDGET_SCALE=1.5 npx playwright test
      - if: always()
        run: test -f /tmp/perf/web-perf.md && cat /tmp/perf/web-perf.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-perf
          path: /tmp/perf
          if-no-files-found: ignore
      - if: failure()
        run: tail -n 100 /tmp/api.log /tmp/web.log

  perf:
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wisp-saas/go.mod
          cache-dependency-path: wisp-saas/go.sum
      - name: API + RADIUS load budgets (large seeded ISP)
        # Shared runners are slower and noisier than a server: 2× latency budgets.
        run: PERF_REPORT=/tmp/perf PERF_BUDGET_SCALE=2 go test -count=1 -tags perf -run TestPerf -v ./cmd/api/
      - if: always()
        run: test -f /tmp/perf/api-perf.md && cat /tmp/perf/api-perf.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-perf
          path: /tmp/perf
          if-no-files-found: ignore

  images:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build every image
        run: |
          for c in api radius; do docker build -f infra/docker/go.Dockerfile --build-arg CMD=$c -t wisp-$c .; done
          docker build -f infra/docker/wg-gateway.Dockerfile -t wisp-wg-gateway .
          docker build -f infra/docker/freeradius.Dockerfile -t wisp-freeradius .
          docker build -f infra/docker/mock.Dockerfile -t wisp-mikrotik-mock .
          docker build -f infra/docker/web.Dockerfile -t wisp-web .
      - name: FreeRADIUS config parses
        run: docker run --rm -e RADIUS_API_TOKEN=x wisp-freeradius freeradius -XC
